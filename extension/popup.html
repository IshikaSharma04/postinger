<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save to Postinger</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #FAFAF8;
      color: #121212;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .badge {
      background: #98E376;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #525252;
      display: block;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #D5D3CB;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      background: #fff;
      margin-bottom: 12px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #121212;
    }
    textarea {
      resize: vertical;
      height: 70px;
    }
    button {
      width: 100%;
      background: #121212;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #282828;
    }
    .status {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Postinger</span>
    <span class="badge">Ideas Clipper</span>
  </div>

  <form id="clipForm">
    <label for="title">Title</label>
    <input type="text" id="title" required placeholder="Idea title...">

    <label for="content">Note / Excerpt</label>
    <textarea id="content" placeholder="Key takeaways or link..."></textarea>

    <label for="tags">Tags (comma-separated)</label>
    <input type="text" id="tags" placeholder="tech, launch, inspiration" value="Web, Saved">

    <button type="submit" id="saveBtn">Save to Ideas Board</button>
  </form>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
